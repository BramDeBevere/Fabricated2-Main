<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 32px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
    }

    .count-card {
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 32px 64px;
      text-align: center;
    }

    .count-number {
      font-size: 5rem;
      font-weight: 700;
      color: #fff;
      transition: color 0.3s;
    }

    .count-number.active { color: #4ade80; }

    .count-label {
      font-size: 0.8rem;
      color: #555;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    table {
      width: 400px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.75rem;
      padding: 8px 16px;
      text-align: left;
      border-bottom: 1px solid #2a2a35;
    }

    tbody tr {
      border-bottom: 1px solid #1e1e28;
    }

    tbody td {
      padding: 10px 16px;
      color: #ccc;
    }

    tbody tr:empty td, .empty-row td {
      color: #444;
      text-align: center;
    }

    .side-left  { color: #60a5fa; font-weight: 600; }
    .side-right { color: #f97316; font-weight: 600; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #444;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }

    .dot.on { background: #4ade80; }
  </style>
</head>
<body>

  <h1>People Tracker</h1>

  <div class="count-card">
    <div class="count-number" id="count">—</div>
    <div class="count-label">People in frame</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>X (px)</th>
        <th>Y (px)</th>
        <th>X (norm)</th>
        <th>Y (norm)</th>
        <th>Conf</th>
        <th>Side</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr class="empty-row"><td colspan="7">No data yet</td></tr>
    </tbody>
  </table>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status">Connecting...</span>
  </div>

  <script>
    const API_HOST = 'localhost:8000';

    const countEl = document.getElementById('count');
    const tbody   = document.getElementById('tbody');
    const dot     = document.getElementById('dot');
    const status  = document.getElementById('status');

    function connect() {
      const ws = new WebSocket(`ws://${API_HOST}/ws`);

      ws.onopen  = () => { dot.classList.add('on'); status.textContent = 'Connected'; };
      ws.onclose = () => { dot.classList.remove('on'); status.textContent = 'Disconnected — retrying...'; setTimeout(connect, 3000); };

      ws.onmessage = ({ data }) => {
        const d = JSON.parse(data);
        const count = d.person_count ?? 0;

        countEl.textContent = count;
        countEl.classList.toggle('active', count > 0);

        tbody.innerHTML = count === 0
          ? '<tr class="empty-row"><td colspan="7">No people detected</td></tr>'
          : (d.people ?? []).map(p => {
              const nx = p.center_normalized?.x;
              const side = nx == null ? '—'
                : nx < 0.5 ? '<span class="side-right">Right</span>'
                           : '<span class="side-left">Left</span>';
              return `<tr>
                <td>${p.id}</td>
                <td>${p.center.x}</td>
                <td>${p.center.y}</td>
                <td>${p.center_normalized.x}</td>
                <td>${p.center_normalized.y}</td>
                <td>${p.confidence != null ? (p.confidence * 100).toFixed(1) + '%' : '—'}</td>
                <td>${side}</td>
              </tr>`;
            }).join('');
      };
    }

    connect();
  </script>

</body>
</html>
